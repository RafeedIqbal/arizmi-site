  - main [ref=e418]:
    - generic [ref=e419]:
      - heading "For people building something that does not exist yet." [level=1] [ref=e420]
      - paragraph [ref=e421]: Arizmi Labs is a product and software studio helping founders, operators and teams turn early ideas into working digital products, platforms and AI-enabled systems.
      - paragraph [ref=e422]: We bring together product thinking, technical build and commercial judgement, so the thing in your head can become something people can use.
    - region [ref=e423]:
      - heading "Why Arizmi?" [level=2] [ref=e424]
      - paragraph [ref=e425]: The name Arizmi is drawn from al-Khwarizmi, one of history’s great system thinkers. His work helped give the world algebra, algorithms and a new way to break complexity down into something solvable.
      - paragraph [ref=e426]: "This is the idea behind the studio: take something complex, find the logic inside it and turn it into something useful."
    - region [ref=e427]:
      - heading "The way we think" [level=2] [ref=e428]
      - paragraph [ref=e429]: "We work with three core principles in mind:"
      - list [ref=e430]:
        - listitem [ref=e431]:
          - paragraph [ref=e432]: "01"
          - heading "Move fast, with structure" [level=3] [ref=e433]
          - paragraph [ref=e434]: Speed matters, but so do the decisions behind the build.
        - listitem [ref=e435]:
          - paragraph [ref=e436]: "02"
          - heading "Build around the user" [level=3] [ref=e437]
          - paragraph [ref=e438]: The product has to make sense for the people using it, not just the team commissioning it.
        - listitem [ref=e439]:
          - paragraph [ref=e440]: "03"
          - heading "Leave room for the next version" [level=3] [ref=e441]
          - paragraph [ref=e442]: A strong first version should be able to launch, learn and improve.
    - region [ref=e443]:
      - heading "The team in the lab" [level=2] [ref=e444]
      - paragraph [ref=e445]: Arizmi brings together product, software, AI, strategy and operations thinking, so ideas can be shaped, built and improved from more than one angle.
      - list [ref=e446]:
        - listitem [ref=e447]:
          - article [ref=e448]:
            - heading "Kaynat Choudhury" [level=3] [ref=e449]
            - paragraph [ref=e450]: Kaynat brings the strategic, commercial and customer intelligence behind Arizmi.
            - paragraph [ref=e451]: With 15+ years across product, marketing, UX, positioning, fintech, financial services and media, she has built a career around complex things that do not easily explain themselves. Her strength is turning that complexity into products, propositions and journeys people can understand, trust and act on.
            - paragraph [ref=e452]: "At Arizmi, Kaynat shapes the thinking behind each build: what the product needs to become, who it needs to serve, what will make users hesitate and what needs to happen for the idea to move into the market with confidence. She brings the behavioural insight, positioning and commercial judgement that make Arizmi’s work more than a technical build."
            - paragraph [ref=e453]: Recognised as one of the Top 30 Most Influential Fintech Marketers, Kaynat brings the senior strategic edge that helps clients build products people actually want to use, buy into and believe in.
            - paragraph [ref=e454]: "Focus: product strategy, positioning, customer experience, behavioural insight, UX, conversion, go-to-market, commercial direction"
        - listitem [ref=e455]:
          - article [ref=e456]:
            - heading "Mish Choudhury" [level=3] [ref=e457]
            - paragraph [ref=e458]: Mish brings the conviction and founder energy behind Arizmi.
            - paragraph [ref=e459]: "With over a decade across technology, government, digital strategy, fitness and wellbeing, he has built his career around one thing: helping people move. Move better, think better, train better, work better and adopt better systems."
            - paragraph [ref=e460]: As a qualified fitness professional, author and product founder, Mish understands both the human side and the systems side of building something people believe in. At Arizmi, he helps turn ambition into product direction, challenging ideas until they are sharper, more useful and ready to become something real.
            - paragraph [ref=e461]: "Focus: product direction, founder vision, user behaviour, innovation, fitness technology, wellbeing, product adoption"
        - listitem [ref=e462]:
          - article [ref=e463]:
            - heading "Taseen Choudhury" [level=3] [ref=e464]
            - paragraph [ref=e465]: Taseen brings tech-first commercial thinking into Arizmi.
            - paragraph [ref=e466]: He is wired for efficiency, execution and high product value, helping clients move from loose ideas to systems that are commercially useful, operationally clear and built with the right level of ambition. His work across product-led ventures and premium client projects has given him a sharp instinct for what people want, what a build needs to deliver and how to turn a brief into something people are proud to put their name on.
            - paragraph [ref=e467]: At Arizmi, Taseen helps clients think bigger while staying grounded in what can be built, sold and scaled. He brings the relationship-building, operational discipline and delivery mindset that help turn ambitious ideas into products with real-world momentum.
            - paragraph [ref=e468]: "Focus: commercial execution, operational efficiency, product value, client relationships, partnerships, sales, delivery"
        - listitem [ref=e469]:
          - article [ref=e470]:
            - heading "Rafeed Iqbal" [level=3] [ref=e471]
            - paragraph [ref=e472]: Rafeed brings the engineering logic behind Arizmi.
            - paragraph [ref=e473]: With a software engineering background and experience taking a product from zero to one, he helps turn ambitious ideas into technical decisions that make sense. His strength is in breaking down complexity, understanding what a product needs to do and shaping the build so the first version can move from concept to working software.
            - paragraph [ref=e474]: "At Arizmi, Rafeed supports the technical route behind each product: how it should function, what needs to be built first, where the complexity sits and how to create systems that are usable, scalable and ready to improve. He brings the problem-solving, engineering discipline and product thinking needed to make ideas real."
            - paragraph [ref=e475]: "Focus: software engineering, product management, technical scoping, product architecture, web applications, problem-solving, product build"
    - region [ref=e476]:
      - heading "Ready to build?" [level=2] [ref=e477]
      - paragraph [ref=e478]: Early idea, messy workflow, ambitious product or system nobody has built for you properly yet, this is where Arizmi is useful.
      - paragraph [ref=e479]: We help find the shape, build the system and move it towards something people can use.
      - generic [ref=e481]:
        - text: Book a build call
        - generic [ref=e482]: Booking opens soon
